<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#8b5e3c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

<body>

  <script type="module" src="js/app.js"></script>
